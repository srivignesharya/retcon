<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RETCON - Comic Puzzle Platformer</title>
  <meta name="description" content="RETCON: A comic-book puzzle platformer. Rewrite reality by editing the narrative. Developed for Game Jam by Team APEX.">
  <link rel="icon" href="data:,">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #12131C;
      background-image: 
        radial-gradient(circle at 50% 50%, #1e2133 0%, #0d0e15 100%);
      font-family: 'Impact', 'Arial Black', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 1.5px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    /* Fixed 960x600 aspect ratio container scaled to window */
    #canvas-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: calc(100vh * (960 / 600));
      max-height: calc(100vw * (600 / 960));
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    /* Touch Controls Overlay for Mobile / Touch screens */
    #touch-controls {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      padding: 0 30px;
      justify-content: space-between;
      pointer-events: none;
    }

    .touch-btn {
      pointer-events: auto;
      width: 64px;
      height: 64px;
      background: rgba(255, 230, 0, 0.85);
      border: 3px solid #000;
      border-radius: 50%;
      font-size: 24px;
      font-weight: 900;
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 3px 3px 0 #000;
      touch-action: manipulation;
    }

    .touch-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #000;
    }

    @media (pointer: coarse) {
      #touch-controls {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="canvas-wrapper">
      <canvas id="gameCanvas" width="960" height="600" tabindex="0"></canvas>

      <!-- Iframe Focus Overlay Banner (appears only if game loses focus during play inside an iframe) -->
      <div id="focus-overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26, 26, 46, 0.85); z-index: 999; justify-content: center; align-items: center; cursor: pointer;">
        <div style="background: #ffd400; border: 4px solid #1a1a2e; border-radius: 8px; padding: 18px 36px; box-shadow: 6px 6px 0 #1a1a2e; text-align: center;">
          <div style="font-family: 'Arial Black', Impact, sans-serif; font-size: 22px; color: #1a1a2e; letter-spacing: 1.5px;">CLICK TO FOCUS GAME</div>
          <div style="font-family: 'Arial Black', sans-serif; font-size: 13px; color: #1a1a2e; margin-top: 6px;">Enables keyboard controls inside iframe</div>
        </div>
      </div>
    </div>

    <!-- On-screen touch controls for tablet/mobile devices -->
    <div id="touch-controls">
      <div style="display: flex; gap: 14px;">
        <button class="touch-btn" id="btn-left">◀</button>
        <button class="touch-btn" id="btn-right">▶</button>
      </div>
      <button class="touch-btn" id="btn-jump">▲</button>
    </div>
  </div>

  <!-- Local Game Scripts - Explicit Relative Paths for Itch.io & Offline (No CDN, No Bundler) -->
  <script src="./js/theme.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/narrator.js"></script>
  <script src="./js/particles.js"></script>
  <script src="./js/rules.js"></script>
  <script src="./js/levels.js"></script>
  <script src="./js/hero.js"></script>
  <script src="./js/renderer.js"></script>
  <script src="./js/game.js"></script>

  <!-- Aspect-Ratio Scaling, Iframe Focus Handling & Touch Wiring -->
  <script>
    // 1. Dynamic Aspect-Ratio Preserving Scaling (Fixed 960x600 logical resolution)
    function resizeCanvas() {
      const container = document.getElementById('game-container');
      const wrapper = document.getElementById('canvas-wrapper');
      if (!container || !wrapper) return;

      const availW = container.clientWidth || window.innerWidth;
      const availH = container.clientHeight || window.innerHeight;
      const targetRatio = 960 / 600;

      let w = availW - 20; // 10px safe margin on sides
      let h = w / targetRatio;
      if (h > availH - 20) {
        h = availH - 20;
        w = h * targetRatio;
      }

      wrapper.style.width = Math.floor(w) + 'px';
      wrapper.style.height = Math.floor(h) + 'px';
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', resizeCanvas);
    window.addEventListener('DOMContentLoaded', resizeCanvas);
    window.addEventListener('load', resizeCanvas);

    // 2. Iframe Focus Management (Ensures keyboard works instantly on Itch.io)
    const focusOverlay = document.getElementById('focus-overlay');
    const canvas = document.getElementById('gameCanvas');

    const ensureFocus = () => {
      window.focus();
      if (canvas) canvas.focus();
      if (focusOverlay) focusOverlay.style.display = 'none';
      if (window.sounds) window.sounds.init();
    };

    if (canvas) {
      canvas.addEventListener('click', ensureFocus);
      canvas.addEventListener('mousedown', ensureFocus);
    }

    if (focusOverlay) {
      focusOverlay.addEventListener('click', ensureFocus);
    }

    document.addEventListener('click', ensureFocus);
    window.addEventListener('load', () => {
      try {
        window.focus();
        if (canvas) canvas.focus();
      } catch (err) {}
    });

    window.addEventListener('blur', () => {
      // If embedded in an iframe and running gameplay, prompt player to click to focus
      if (window.game && window.game.state === 'PLAYING') {
        if (focusOverlay) focusOverlay.style.display = 'flex';
      }
    });

    window.addEventListener('focus', () => {
      if (focusOverlay) focusOverlay.style.display = 'none';
    });

    // 3. Touch button wiring for touchscreens
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnJump = document.getElementById('btn-jump');

    if (btnLeft && btnRight && btnJump) {
      const setKey = (code, pressed) => {
        window.dispatchEvent(new KeyboardEvent(pressed ? 'keydown' : 'keyup', { code }));
      };

      btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); setKey('KeyA', true); });
      btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); setKey('KeyA', false); });

      btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); setKey('KeyD', true); });
      btnRight.addEventListener('touchend', (e) => { e.preventDefault(); setKey('KeyD', false); });

      btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); setKey('Space', true); });
      btnJump.addEventListener('touchend', (e) => { e.preventDefault(); setKey('Space', false); });
    }
  </script>
</body>
</html>
